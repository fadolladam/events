name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — Laravel tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, gd, zip, bcmath, mbstring
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # The committed vendor/ is --no-dev; pull the dev tools (phpunit, mockery…)
      - name: Install dependencies (with dev)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite
        run: php artisan test

      - name: Check formatting (Pint)
        run: vendor/bin/pint --test

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `build` runs `tsc -b` first, so this also covers the type check.
      - name: Typecheck + production build
        run: npm run build

      - name: Verify SPA was published into backend/public
        run: |
          test -f ../backend/public/index.html || { echo "::error::backend/public/index.html missing after build"; exit 1; }
          test -n "$(ls -A ../backend/public/assets 2>/dev/null)" || { echo "::error::backend/public/assets is empty after build"; exit 1; }
          grep -q '/assets/' ../backend/public/index.html || { echo "::error::index.html does not reference built assets"; exit 1; }
