; App overrides for `php artisan serve` (loaded from conf.d, wins over defaults).
; Cover/banner uploads are capped at 5 MB by the app; give PHP headroom so a
; file just over 2 MB reaches Laravel and gets a friendly validation message
; instead of PHP's raw "failed to upload".
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 60
