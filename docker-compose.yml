name: events

# Copy `.env.docker.example` to `.env` and fill it in before a real deployment.
# APP_KEY has no default here on purpose — set it or the stack refuses to start.
#   docker compose run --rm events-backend php artisan key:generate --show

services:
  # Database Service (MySQL 8.0)
  events-db:
    image: mysql:8.0
    container_name: events-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-events}
      MYSQL_USER: ${DB_USERNAME:-events_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-events_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      # Bound to loopback only — MySQL is not reachable from outside this host.
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - events_db_data:/var/lib/mysql
    networks:
      - events-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Application (Laravel API + the pre-built React SPA, served together)
  events-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: events-backend
    restart: unless-stopped
    depends_on:
      events-db:
        condition: service_healthy
    environment:
      APP_NAME: "RHB Events"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:5173}
      APP_KEY: "${APP_KEY:?APP_KEY is required - see .env.docker.example}"
      DB_CONNECTION: mysql
      DB_HOST: events-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-events}
      DB_USERNAME: ${DB_USERNAME:-events_user}
      DB_PASSWORD: ${DB_PASSWORD:-events_secret}
      # First-party SPA cookie auth. Set these to your real host(s) in prod.
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:5173,127.0.0.1:5173,localhost,127.0.0.1}
      SESSION_DRIVER: database
      # Set SESSION_SECURE_COOKIE=true (and serve over HTTPS) in production.
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_SAME_SITE: lax
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      # Whole app (SPA + API) on http://localhost:5173
      - "5173:8000"
    volumes:
      # Persist device-uploaded images across container rebuilds
      - events_backend_uploads:/var/www/html/storage/app/public
    networks:
      - events-network

volumes:
  events_db_data:
    name: events_db_data
  events_backend_uploads:
    name: events_backend_uploads

networks:
  events-network:
    name: events-network
